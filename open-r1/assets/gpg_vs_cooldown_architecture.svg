<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" width="1160" height="540">
  <defs>
    <style>
      .title { font-family: "Times New Roman", Times, Georgia, serif; font-size: 26px; font-weight: bold; fill: #111111; }
      .ours-tag { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-weight: bold; fill: #2E5E44; text-anchor: middle; }
      .box-label { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; fill: #111111; text-anchor: middle; }
      .math { font-family: "Times New Roman", Times, Georgia, serif; font-size: 18px; fill: #111111; text-anchor: middle; }
      .arc-label { font-family: "Times New Roman", Times, Georgia, serif; font-size: 14px; fill: #111111; text-anchor: middle; }
      .arc-label-green { font-family: "Times New Roman", Times, Georgia, serif; font-size: 13px; fill: #1F4E37; text-anchor: middle; }
      .dots { font-family: "Times New Roman", Times, Georgia, serif; font-size: 16px; font-weight: bold; fill: #222222; text-anchor: middle; }
      .it { font-style: italic; }
      .sub { font-size: 72%; baseline-shift: sub; }
      .box-white { fill: #FFFFFF; stroke: #4A5568; stroke-width: 1.3; }
      .box-trained { fill: #FFF0C2; stroke: #34495E; stroke-width: 1.6; }
      .box-frozen { fill: #D6E8FA; stroke: #34495E; stroke-width: 1.6; }
      .box-ours { fill: #D5EDD8; stroke: #2E5E44; stroke-width: 1.6; }
      .group-pill { fill: #EFEFEF; }
      .legend-bg { fill: #F2F2F2; }
    </style>

    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0.8, 7.5 3.5, 0 6.2" fill="#222222"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0.8, 7.5 3.5, 0 6.2" fill="#2E6B4E"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1160" height="540" fill="#FFFFFF"/>

  <!-- ==================== TOP SECTION: GPG ==================== -->
  <text x="28" y="40" class="title">GPG</text>

  <!-- Col 1: Uniform Sampler -->
  <rect x="30" y="110" width="132" height="56" rx="7" class="box-white"/>
  <text x="96" y="134" class="box-label">Uniform</text>
  <text x="96" y="153" class="box-label">Sampler</text>

  <line x1="162" y1="138" x2="182" y2="138" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 2: q -->
  <rect x="184" y="116" width="48" height="44" rx="6" class="box-white"/>
  <text x="208" y="143" class="math"><tspan class="it">q</tspan></text>

  <line x1="232" y1="138" x2="252" y2="138" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 3: Policy Model -->
  <rect x="254" y="110" width="118" height="56" rx="8" class="box-trained"/>
  <text x="313" y="134" class="box-label">Policy</text>
  <text x="313" y="153" class="box-label">Model</text>

  <line x1="372" y1="138" x2="392" y2="138" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 4: Completions o_1..o_G -->
  <rect x="394" y="58" width="74" height="160" rx="10" class="group-pill"/>
  <rect x="403" y="66" width="56" height="34" rx="5" class="box-white"/>
  <text x="431" y="88" class="math"><tspan class="it">o</tspan><tspan class="sub">1</tspan></text>
  <rect x="403" y="106" width="56" height="34" rx="5" class="box-white"/>
  <text x="431" y="128" class="math"><tspan class="it">o</tspan><tspan class="sub">2</tspan></text>
  <text x="431" y="159" class="dots">...</text>
  <rect x="403" y="176" width="56" height="34" rx="5" class="box-white"/>
  <text x="431" y="198" class="math"><tspan class="it">o</tspan><tspan class="sub it">G</tspan></text>

  <line x1="468" y1="138" x2="488" y2="138" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 5: Reward Verifier -->
  <rect x="490" y="110" width="116" height="56" rx="8" class="box-frozen"/>
  <text x="548" y="134" class="box-label">Reward</text>
  <text x="548" y="153" class="box-label">Verifier</text>

  <line x1="606" y1="138" x2="626" y2="138" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 6: Rewards r_1..r_G -->
  <rect x="628" y="58" width="74" height="160" rx="10" class="group-pill"/>
  <rect x="637" y="66" width="56" height="34" rx="5" class="box-white"/>
  <text x="665" y="88" class="math"><tspan class="it">r</tspan><tspan class="sub">1</tspan></text>
  <rect x="637" y="106" width="56" height="34" rx="5" class="box-white"/>
  <text x="665" y="128" class="math"><tspan class="it">r</tspan><tspan class="sub">2</tspan></text>
  <text x="665" y="159" class="dots">...</text>
  <rect x="637" y="176" width="56" height="34" rx="5" class="box-white"/>
  <text x="665" y="198" class="math"><tspan class="it">r</tspan><tspan class="sub it">G</tspan></text>

  <line x1="702" y1="138" x2="722" y2="138" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 7: Group Computation -->
  <rect x="724" y="110" width="134" height="56" rx="7" class="box-white"/>
  <text x="791" y="134" class="box-label">Group</text>
  <text x="791" y="153" class="box-label">Computation</text>

  <line x1="858" y1="138" x2="878" y2="138" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 8: Advantages A_1..A_G -->
  <rect x="880" y="58" width="74" height="160" rx="10" class="group-pill"/>
  <rect x="889" y="66" width="56" height="34" rx="5" class="box-white"/>
  <text x="917" y="88" class="math"><tspan class="it">A</tspan><tspan class="sub">1</tspan></text>
  <rect x="889" y="106" width="56" height="34" rx="5" class="box-white"/>
  <text x="917" y="128" class="math"><tspan class="it">A</tspan><tspan class="sub">2</tspan></text>
  <text x="917" y="159" class="dots">...</text>
  <rect x="889" y="176" width="56" height="34" rx="5" class="box-white"/>
  <text x="917" y="198" class="math"><tspan class="it">A</tspan><tspan class="sub it">G</tspan></text>

  <!-- Top Direct PG Arc -->
  <path d="M 917 58 C 820 6, 405 6, 313 108" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="615" y="19" class="arc-label">Direct PG</text>

  <!-- ==================== CENTER DIVIDER ==================== -->
  <line x1="24" y1="248" x2="986" y2="248" stroke="#888888" stroke-width="2" stroke-dasharray="9,6"/>

  <!-- ==================== BOTTOM SECTION: GPG + COOLDOWN (OURS) ==================== -->
  <text x="28" y="286" class="title">GPG + Cooldown</text>
  <text x="122" y="308" class="ours-tag">(Ours)</text>

  <!-- Col 1: Cooldown Sampler -->
  <rect x="30" y="354" width="132" height="56" rx="8" class="box-ours"/>
  <text x="96" y="378" class="box-label">Cooldown</text>
  <text x="96" y="397" class="box-label">Sampler</text>

  <line x1="162" y1="382" x2="182" y2="382" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 2: q -->
  <rect x="184" y="360" width="48" height="44" rx="6" class="box-white"/>
  <text x="208" y="387" class="math"><tspan class="it">q</tspan></text>

  <line x1="232" y1="382" x2="252" y2="382" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 3: Policy Model -->
  <rect x="254" y="354" width="118" height="56" rx="8" class="box-trained"/>
  <text x="313" y="378" class="box-label">Policy</text>
  <text x="313" y="397" class="box-label">Model</text>

  <line x1="372" y1="382" x2="392" y2="382" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 4: Completions o_1..o_G -->
  <rect x="394" y="302" width="74" height="160" rx="10" class="group-pill"/>
  <rect x="403" y="310" width="56" height="34" rx="5" class="box-white"/>
  <text x="431" y="332" class="math"><tspan class="it">o</tspan><tspan class="sub">1</tspan></text>
  <rect x="403" y="350" width="56" height="34" rx="5" class="box-white"/>
  <text x="431" y="372" class="math"><tspan class="it">o</tspan><tspan class="sub">2</tspan></text>
  <text x="431" y="403" class="dots">...</text>
  <rect x="403" y="420" width="56" height="34" rx="5" class="box-white"/>
  <text x="431" y="442" class="math"><tspan class="it">o</tspan><tspan class="sub it">G</tspan></text>

  <line x1="468" y1="382" x2="488" y2="382" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 5: Reward Verifier -->
  <rect x="490" y="354" width="116" height="56" rx="8" class="box-frozen"/>
  <text x="548" y="378" class="box-label">Reward</text>
  <text x="548" y="397" class="box-label">Verifier</text>

  <line x1="606" y1="382" x2="626" y2="382" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 6: Rewards r_1..r_G -->
  <rect x="628" y="302" width="74" height="160" rx="10" class="group-pill"/>
  <rect x="637" y="310" width="56" height="34" rx="5" class="box-white"/>
  <text x="665" y="332" class="math"><tspan class="it">r</tspan><tspan class="sub">1</tspan></text>
  <rect x="637" y="350" width="56" height="34" rx="5" class="box-white"/>
  <text x="665" y="372" class="math"><tspan class="it">r</tspan><tspan class="sub">2</tspan></text>
  <text x="665" y="403" class="dots">...</text>
  <rect x="637" y="420" width="56" height="34" rx="5" class="box-white"/>
  <text x="665" y="442" class="math"><tspan class="it">r</tspan><tspan class="sub it">G</tspan></text>

  <line x1="702" y1="382" x2="722" y2="382" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 7: Group Computation -->
  <rect x="724" y="354" width="134" height="56" rx="7" class="box-white"/>
  <text x="791" y="378" class="box-label">Group</text>
  <text x="791" y="397" class="box-label">Computation</text>

  <line x1="858" y1="382" x2="878" y2="382" stroke="#222222" stroke-width="1.4" marker-end="url(#arrow-dark)"/>

  <!-- Col 8: Advantages A_1..A_G -->
  <rect x="880" y="302" width="74" height="160" rx="10" class="group-pill"/>
  <rect x="889" y="310" width="56" height="34" rx="5" class="box-white"/>
  <text x="917" y="332" class="math"><tspan class="it">A</tspan><tspan class="sub">1</tspan></text>
  <rect x="889" y="350" width="56" height="34" rx="5" class="box-white"/>
  <text x="917" y="372" class="math"><tspan class="it">A</tspan><tspan class="sub">2</tspan></text>
  <text x="917" y="403" class="dots">...</text>
  <rect x="889" y="420" width="56" height="34" rx="5" class="box-white"/>
  <text x="917" y="442" class="math"><tspan class="it">A</tspan><tspan class="sub it">G</tspan></text>

  <!-- Bottom Direct PG Arc -->
  <path d="M 917 302 C 820 252, 405 252, 313 352" fill="none" stroke="#222222" stroke-width="1.5" marker-end="url(#arrow-dark)"/>
  <text x="615" y="265" class="arc-label">Direct PG</text>

  <!-- Cooldown Table Box -->
  <rect x="275" y="476" width="160" height="42" rx="8" class="box-ours"/>
  <text x="355" y="502" class="box-label">Cooldown Table</text>

  <!-- Cooldown Incoming Arrow: r_group -> Cooldown Table -->
  <path d="M 665 462 C 665 492, 560 497, 437 497" fill="none" stroke="#2E6B4E" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="568" y="515" class="arc-label-green">Update Cooldown</text>

  <!-- Cooldown Outgoing L-Arrow: Cooldown Table -> Cooldown Sampler -->
  <path d="M 275 497 L 108 497 Q 96 497 96 485 L 96 413" fill="none" stroke="#2E6B4E" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="186" y="484" class="arc-label-green">Skip / Review</text>

  <!-- ==================== RIGHT LEGEND ==================== -->
  <rect x="1002" y="128" width="134" height="264" rx="14" class="legend-bg"/>

  <rect x="1016" y="148" width="106" height="58" rx="8" class="box-trained"/>
  <text x="1069" y="173" class="box-label">Trained</text>
  <text x="1069" y="193" class="box-label">Models</text>

  <rect x="1016" y="231" width="106" height="58" rx="8" class="box-frozen"/>
  <text x="1069" y="256" class="box-label">Frozen /</text>
  <text x="1069" y="276" class="box-label">Verifier</text>

  <rect x="1016" y="314" width="106" height="58" rx="8" class="box-ours"/>
  <text x="1069" y="339" class="box-label">Cooldown</text>
  <text x="1069" y="359" class="box-label">(Ours)</text>
</svg>
