# Local RTX 4060 8GB Windows config for GPG cooldown sampling (num_generations=8, 200-problem dataset)
model_name_or_path: models/Qwen2.5-0.5B-Instruct
model_revision: main
torch_dtype: bfloat16
attn_implementation: sdpa

# LoRA to fit comfortably inside 8GB VRAM
use_peft: true
lora_r: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
- q_proj
- v_proj

# 200-problem local math dataset (generated by scripts/generate_math_dataset.py)
dataset_name: datas/math_200
system_prompt: "You are a helpful math assistant. Solve the problem step by step and put the final answer inside \\boxed{}."

# GPG / GRPO trainer config
bf16: true
use_vllm: false
do_eval: false
eval_strategy: "no"
gradient_accumulation_steps: 1
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
learning_rate: 5.0e-05
log_completions: false
log_level: info
logging_first_step: true
logging_steps: 1
logging_strategy: steps
lr_scheduler_type: cosine
max_prompt_length: 256
max_completion_length: 192
max_steps: 200
num_generations: 4
num_train_epochs: 3
output_dir: outputs/exp200_uniform_cooldown
overwrite_output_dir: true
per_device_train_batch_size: 8
per_device_eval_batch_size: 8
push_to_hub: false
report_to:
- tensorboard
reward_funcs:
- accuracy
reward_weights:
- 1.0
weighted_sample: true
sample_strategy: uniform
cooldown_steps: 20
min_inverse_alpha: 0.0
scale_rewards: false
save_strategy: "steps"
save_steps: 50
save_total_limit: 2
seed: 42
warmup_ratio: 0.1
